[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = [] }
tauri-plugin-log = "2"

# --- Inicio de sesion de Microsoft (Paso 3) ---
# Peticiones HTTPS a Microsoft, Xbox y Minecraft. En Windows usa el TLS del sistema.
reqwest = { version = "0.12", features = ["json"] }
# PKCE: numeros aleatorios del sistema, SHA-256 y base64 para URL.
getrandom = "0.3"
sha2 = "0.10"
base64 = "0.22"
# Construye la direccion de inicio de sesion con sus parametros.
url = "2"
# Guarda el token de sesion en el Administrador de credenciales de Windows.
keyring = { version = "3", features = ["windows-native"] }
# Abre el navegador del sistema.
open = "5"

# --- Instalacion y arranque del juego (Paso 4) ---
# SHA-1: la huella con la que Mojang y Forge publican sus archivos.
# (SHA-512, para los mods, ya viene con sha2.)
sha1 = "0.10"

# Las huellas se calculan sobre cientos de MB: estas dos librerias se
# compilan optimizadas tambien en desarrollo para que no frenen la descarga.
[profile.dev.package.sha1]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
